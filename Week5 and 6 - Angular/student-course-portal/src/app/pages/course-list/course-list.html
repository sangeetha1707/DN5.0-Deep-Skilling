<div class="course-list">
  <h2>Available Courses</h2>

  <!-- Search with query param -->
  <div>
    <input
      [(ngModel)]="searchTerm"
      placeholder="Search courses..."
      (input)="onSearch()" />
  </div>

  <!-- Error message -->
  <div *ngIf="errorMessage$ | async as error" style="color: red;">
    <p>{{ error }}</p>
  </div>

  <!-- Loading -->
  <div *ngIf="isLoading$ | async">
    <p>Loading courses...</p>
  </div>

  <!-- Course list -->
  <div *ngIf="!(isLoading$ | async)">
    <div *ngIf="(courses$ | async)?.length ?? 0 > 0; else noCourses">
      <app-course-card
        *ngFor="let course of courses$ | async; let i = index; trackBy: trackByCourseId"
        [course]="course"
        (enrollRequested)="onEnroll($event)"
        (click)="onCardClick(course.id)"
        style="cursor: pointer;">
      </app-course-card>
    </div>

    <ng-template #noCourses>
      <p>No courses available.</p>
    </ng-template>
  </div>

  <p *ngIf="selectedCourseId">Selected course ID: {{ selectedCourseId }}</p>
</div>
